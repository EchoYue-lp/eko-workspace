    <radialGradient id="right-mask" cx="0" cy="0" r="1" gradientTransform="translate(652 395) rotate(116) scale(240 160)" gradientUnits="userSpaceOnUse"><stop stop-color="#8F9BA3"/><stop offset="1" stop-color="#BAC4C9"/></radialGradient>
